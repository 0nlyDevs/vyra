# Configuration des outils Python de processing/ (dépendances : requirements.txt).

[project]
name = "mindstack-processing"
version = "0.1.0"
description = "IA et traitements de l'équipe MindStack — hackathon DevFest Antananarivo 2026"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle (erreurs)
  "W",     # pycodestyle (avertissements)
  "F",     # pyflakes
  "I",     # tri des imports
  "N",     # nommage PEP 8
  "B",     # bugbear (bugs probables)
  "UP",    # syntaxe Python moderne
  "SIM",   # simplifications
  "ASYNC", # erreurs courantes en async
  "FAST",  # bonnes pratiques FastAPI
  "T20",   # pas de print()
  "RUF",   # règles propres à Ruff
]
ignore = [
  "B008",  # Depends(...) en valeur par défaut est le style FastAPI
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Pas de dossier .pytest_cache dans le code monté dans Docker.
addopts = "-q -p no:cacheprovider"
