# Déploie web/ (Next.js) sur Vercel à chaque push sur main.
# Le plan Hobby de Vercel ne relie pas un dépôt privé d'organisation (ce dépôt est un fork privé) :
# on passe par la CLI. Secrets du dépôt : VERCEL_TOKEN (vercel.com/account/tokens),
# VERCEL_ORG_ID et VERCEL_PROJECT_ID (dans .vercel/project.json après `vercel link`).
# Le projet Vercel a « web » comme dossier racine et y garde ses variables (DATABASE_URL…).
name: Déployer le web sur Vercel

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Construit chez Vercel, avec ses variables de production.
      - run: npx --yes vercel@62.4.0 deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
